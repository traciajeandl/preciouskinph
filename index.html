<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PresciousSkinPH</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/preciouskin-logo.png">
    <link href="./style.css" rel="stylesheet">
</head>

<body>
    <header class="fixed top-0 left-0 w-full z-50 bg-amber-950/50 backdrop-blur-lg border-b border-amber-950/20 shadow-lg">
        <nav aria-label="Global" class="relative mx-auto flex max-w-7xl items-center justify-between p-6 lg:px-8">

        <!-- Logo -->
        <a href="#" class="-m-1.5 p-1.5">
            <img
                src="assets/preciouskin-logo.png"
                alt="PreciousSkin"
                class="h-10 w-auto scale-150 origin-left"
            >
        </a>
        <!-- Center Title -->
        <div class="hidden lg:block absolute left-1/2 -translate-x-1/2">
            <a href="#" class="text-3xl font-['Cormorant_Garamond'] tracking-widest">
            PRECIOUSSKIN PH
            </a>
        </div>

        <!-- Mobile Menu -->
        <div class="flex lg:hidden bg-amber-800">
            <button type="button" command="show-modal" commandfor="mobile-menu"
            class="-m-2.5 inline-flex items-center justify-center rounded-md p-2.5 text-white">
            <span class="sr-only">Open main menu</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="size-6">
                <path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            </button>
        </div>

        <!-- Desktop Menu -->
        <el-popover-group class="hidden lg:flex lg:gap-x-12">
            <a href="#" class="text-sm font-semibold text-white">Shop</a>
            <a href="#" class="text-sm font-semibold text-white">Contact</a>
            <a href="#" class="text-sm font-semibold text-white">About</a>
        </el-popover-group>
    </nav>
    <el-dialog>
        <dialog id="mobile-menu" class="backdrop:bg-transparent lg:hidden">
        <div tabindex="0" class="fixed inset-0 focus:outline-none">
            <el-dialog-panel class="fixed inset-y-0 right-0 z-50 w-full overflow-y-auto bg-amber-800 p-6 sm:max-w-sm sm:ring-1 sm:ring-gray-100/10">
            <div class="flex items-center justify-between">
                <a href="#" class="-m-1.5 p-1.5">
                <span class="sr-only">PreciousSkin</span>
                <img src="assets/preciouskin-logo.png" alt="" class="h-10 w-auto"/>
                </a>
                <button type="button" command="close" commandfor="mobile-menu" class="-m-2.5 rounded-md p-2.5 text-gray-400">
                <span class="sr-only">Close menu</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-slot="icon" aria-hidden="true" class="size-6">
                    <path d="M6 18 18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                </button>
            </div>
            <div class="mt-6 flow-root">
                <div class="space-y-2 py-6">
                    <a href="#" class="-mx-3 block rounded-lg px-3 py-2 text-base/7 font-semibold text-white hover:bg-white/5">
                        Shop
                    </a>
                    <a href="#" class="-mx-3 block rounded-lg px-3 py-2 text-base/7 font-semibold text-white hover:bg-white/5">
                        Contact
                    </a>
                    <a href="#" class="-mx-3 block rounded-lg px-3 py-2 text-base/7 font-semibold text-white hover:bg-white/5">
                        About
                    </a>
                </div>
            </div>
            </el-dialog-panel> 
        </div>
        </dialog>
    </el-dialog>
    </header>

    <section class="relative w-full h-screen">
        <!-- Background Image -->
        <img
            src="assets/home-bg.png"
            alt="PreciousSkin"
            class="w-full h-full object-cover"
        >

        <!-- Text Overlay -->
        <div class="absolute inset-0 flex items-center">
            <div class="ml-10 md:ml-20 max-w-xl text-white">
                <p class="text-lg uppercase tracking-widest mb-2 font-bold bg-amber-950">
                    TRENDING NOW
                </p>

                <h1 class="text-5xl md:text-7xl font-serif leading-none">
                    PRECIOUS SKIN
                </h1>

                <p class="mt-4 text-xl font-bold">
                    FACE AND BODY WASH & FACE SERUM
                </p>

            </div>
        </div>
    </section>
    <section class="">
        <img
            src="assets/PS-BW1.jpeg"
            alt="PreciousSkin"
            class="w-full h-full object-cover"
        >
    </section>

    
</body>
</html>
